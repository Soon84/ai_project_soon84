name: AI Workflow Check

# main 브랜치에 push가 발생하면 이 워크플로를 실행합니다.
on:
  push:
    branches:
      - main

jobs:
  check-project:
    # GitHub에서 제공하는 Ubuntu 환경에서 작업을 실행합니다.
    runs-on: ubuntu-latest

    steps:
      # 현재 저장소 코드를 워크플로 실행 환경으로 가져옵니다.
      - name: Checkout repository
        uses: actions/checkout@v4

      # 안내 문구를 실행 로그에 출력합니다.
      - name: Print workflow messages
        run: |
          echo "코드 수정이 일어났습니다."
          echo "AI Workflow 자동화가 실행되었습니다."
          echo "자동 검사 완료"

      # 현재 프로젝트에 어떤 파일이 있는지 목록을 출력합니다.
      - name: Show project files
        run: ls -la

      # 필수 파일이 모두 존재하는지 확인합니다.
      # 하나라도 없으면 exit 1로 워크플로를 실패시킵니다.
      - name: Check required files
        run: |
          test -f index.html || { echo "index.html 파일이 없습니다."; exit 1; }
          test -f script.js || { echo "script.js 파일이 없습니다."; exit 1; }
          test -f style.css || { echo "style.css 파일이 없습니다."; exit 1; }
          test -f README.md || { echo "README.md 파일이 없습니다."; exit 1; }
